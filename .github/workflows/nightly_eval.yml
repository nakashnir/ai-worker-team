name: Nightly Eval

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

jobs:
  nightly-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run nightly local script
        run: |
          chmod +x scripts/run_nightly_local.sh
          ./scripts/run_nightly_local.sh
