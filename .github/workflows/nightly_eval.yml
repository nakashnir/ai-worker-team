name: Nightly Eval

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

jobs:
  nightly-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve compose command
        shell: bash
        run: |
          if command -v docker-compose >/dev/null 2>&1; then
            echo "COMPOSE_CMD=docker-compose" >> "${GITHUB_ENV}"
          else
            echo "COMPOSE_CMD=docker compose" >> "${GITHUB_ENV}"
          fi

      - name: Write CI .env
        shell: bash
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=ai_workers
          ANTHROPIC_API_KEY=
          OPENAI_API_KEY=
          DEFAULT_ANTHROPIC_MODEL=claude-sonnet-4-5-20250929
          EOF

      - name: Prepare writable shared directories
        shell: bash
        run: |
          mkdir -p shared/runs shared/reports shared/docs shared/datasets
          touch shared/runs/.gitkeep shared/reports/.gitkeep shared/docs/.gitkeep
          chmod -R 0777 shared
          sudo chown -R 1000:1000 shared || chown -R 1000:1000 shared || true

      - name: Start stack
        shell: bash
        run: |
          ${COMPOSE_CMD} up -d

      - name: Wait for orchestrator health
        shell: bash
        run: |
          for i in {1..120}; do
            code="$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/health || true)"
            if [[ "${code}" == "200" ]]; then
              echo "orchestrator is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "orchestrator did not become healthy in time" >&2
          exit 1

      - name: Inspect shared permissions
        shell: bash
        run: |
          ls -ld shared shared/runs shared/reports shared/docs shared/datasets
          ${COMPOSE_CMD} exec -T worker sh -lc 'id && ls -ld /app/shared /app/shared/runs /app/shared/reports /app/shared/docs /app/shared/datasets'

      - name: Verify dataset file exists
        shell: bash
        run: |
          test -f shared/datasets/sample_eval_valid_v1.jsonl

      - name: Initialize Postgres schema
        shell: bash
        run: |
          ${COMPOSE_CMD} exec -T postgres \
            psql -v ON_ERROR_STOP=1 -U postgres -d ai_workers \
            < ops/sql/001_evalops.sql

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run nightly local script
        run: |
          chmod +x scripts/run_nightly_local.sh
          ./scripts/run_nightly_local.sh

      # ── A12.3: generate + upload regression-summary for alerts ──────────
      - name: Generate regression-summary artifact
        if: always()
        shell: bash
        env:
          RUN_DATE: "${{ github.run_id }}"
          DATASET:  "shared/datasets/sample_eval_valid_v1.jsonl"
        run: python3 .github/scripts/make_regression_summary.py

      - name: Upload regression-summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-summary
          path: "artifacts/nightly/${{ github.run_id }}/regression-summary.json"
          retention-days: 7

      - name: Upload nightly artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-eval-artifacts
          if-no-files-found: warn
          path: |
            shared/reports/**
            shared/runs/**

      - name: Tear down stack
        if: always()
        shell: bash
        run: |
          ${COMPOSE_CMD} down -v
